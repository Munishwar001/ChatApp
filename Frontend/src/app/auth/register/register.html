
<div class="register-container mat-elevation-z4">
  <!-- Innovative Loading Overlay -->
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-content">
      <div class="circles-loader">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="center-dot"></div>
      </div>
      
      <div class="loading-text">Creating your account</div>
      <div class="loading-subtext">Please wait a moment</div>
      
      <div class="progress-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="image-section">
    <h1>Welcome to</h1>
    <h2>ChatSpace 🚀</h2>
    <p>
      Connect instantly and chat seamlessly with friends and teams.  
      Fast, secure, and built with ❤️ 
    </p>
    <ng-lottie [options]="options"></ng-lottie>
  </div>

  <div class="form-section">
    <div class="logo">
      <mat-icon color="primary">apps</mat-icon>
      <h2>Create your account</h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName" [disabled]="isLoading" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email address</mat-label>
        <input matInput type="email" formControlName="email" [disabled]="isLoading" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" [disabled]="isLoading" />
      </mat-form-field>

      <button 
        mat-raised-button 
        color="primary" 
        class="full-width" 
        type="submit"
        [disabled]="isLoading">
        <span *ngIf="!isLoading">Register</span>
        <span *ngIf="isLoading" class="loader-container">
          <mat-spinner diameter="20" class="inline-spinner"></mat-spinner>
          <span>Processing...</span>
        </span>
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <button 
        mat-stroked-button 
        color="accent" 
        class="auth-btn" 
        (click)="loginWithGoogle()"
        [disabled]="isLoading">
        <i class="fa-brands fa-google" style="color:linear-gradient(135deg, #0078d7, #00b4ff);"></i>
        Sign up with Google
      </button>

      <button 
        mat-stroked-button 
        color="accent" 
        class="auth-btn" 
        (click)="loginWithMicrosoft()"
        [disabled]="isLoading">
        <i class="fa-brands fa-microsoft" style="color:linear-gradient(135deg, #0078d7, #00b4ff);"></i>
        Sign up with Microsoft
      </button>

      <p class="text-muted">
        Already have an account?
        <a routerLink="/login">Login here</a>
      </p>
    </form>
  </div>
</div>
