<!-- Add this header component to your layout for mobile menu trigger -->
<header class="mobile-header">
  <button class="menu-toggle-btn" (click)="onMenuToggle()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  
  <div class="header-title">
    <h2>{{ pageTitle }}</h2>
  </div>
  
  <div class="header-actions">
    <!-- Add any additional header actions here -->
  </div>
</header>

<style>
.mobile-header {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 100;
}

.menu-toggle-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: #111827;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.2s;
}

.menu-toggle-btn:hover {
  background: #f3f4f6;
}

.menu-toggle-btn:active {
  background: #e5e7eb;
}

.header-title h2 {
  font-size: 18px;
  font-weight: 600;
  color: #111827;
  margin: 0;
}

.header-actions {
  width: 40px; /* Match menu button width for centering */
}

/* Show header on mobile and tablet */
@media (max-width: 767px) {
  .mobile-header {
    display: flex;
  }
}
</style>
